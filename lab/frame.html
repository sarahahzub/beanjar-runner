<!doctype html>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}video{width:100%;height:100vh}</style>
<video id="v" muted playsinline></video>
<script>
// Same-origin iframe player for the lab: plays ?src, answers the parent's "stat" message with its timing.
const v = document.getElementById('v'), q = new URLSearchParams(location.search);
v.src = q.get('src') || 'avsync.mp4'; v.muted = q.get('muted') !== '0';
let frames = 0, waiting = 0, err = null;
if (v.requestVideoFrameCallback) { const f = () => { frames++; v.requestVideoFrameCallback(f); }; v.requestVideoFrameCallback(f); }
v.addEventListener('waiting', () => waiting++);
v.addEventListener('error', () => err = v.error && v.error.code);
v.play().catch(e => err = String(e));
addEventListener('message', e => {
  if (e.data !== 'stat') return;
  const pq = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : {};
  e.source.postMessage({ frame: 'stat', t: v.currentTime, frames, waiting, err, w: v.videoWidth, h: v.videoHeight,
    total: pq.totalVideoFrames, dropped: pq.droppedVideoFrames, paused: v.paused }, '*');
});
</script>
