# Boot LG firmware in Beanjar (webosbrew/beanjar v0.6.0) on free GitHub runners and smoke-test it.
# The firmware is downloaded from LG's own server (gscs-b2c.lge.com) at run time; it is never
# committed or uploaded (the artifact holds only screenshots, logs and results).
name: beanjar

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'JSON list of {name, fileid, kernel (x86-64|default), runner, optional ipk_url, ipk_sha256}'
        required: true
      boot_min:
        description: minutes to wait for the TV UI
        default: "25"
      mode:
        description: smoke | bench | cpu | brave | dpad | extkb | launch
        default: smoke
      ipk_url:
        description: brave mode, the IPK to test
        default: https://github.com/sarahahzub/Beta-Apps/releases/download/brave-beta-v1.99.5852/com.brave.browser_1.99.5852_arm.ipk
      ipk_sha256:
        description: brave mode, its sha256
        default: 2eb22f3139b06f14903e3804caccaf24ca1611551b9551dcbf5c299e0fb357e2

permissions:
  contents: write   # extkb: read draft release assets (test builds) of this repo

jobs:
  tv:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.jobs) }}
    name: ${{ matrix.name }} (${{ matrix.kernel }}, ${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.mode == 'dpad' && 240 || inputs.mode == 'extkb' && 100 || inputs.mode == 'launch' && 70 || inputs.mode == 'brave' && 110 || 75 }}
    steps:
      - uses: actions/checkout@v4
      - name: Host facts
        run: |
          nproc; free -m | head -2; ls -l /dev/kvm /dev/dri 2>&1 | head -5
          df -h / | tail -1
      - name: Download and check the IPK (brave and dpad modes)
        if: inputs.mode == 'brave' || inputs.mode == 'dpad' || inputs.mode == 'extkb' || inputs.mode == 'launch'
        env:
          IPK_URL: ${{ matrix.ipk_url || inputs.ipk_url }}
          IPK_SHA: ${{ matrix.ipk_sha256 || inputs.ipk_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # a release asset of this repo by API URL (a draft test build): download with the job's token
          case "$IPK_URL" in
          https://api.github.com/repos/${{ github.repository }}/releases/assets/*)
            curl -sS -L --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o brave.ipk "$IPK_URL" ;;
          *) curl -sS -L --retry 3 -o brave.ipk "$IPK_URL" ;;
          esac
          ls -l brave.ipk
          echo "$IPK_SHA  brave.ipk" | sha256sum -c -
      - name: Test clip for the D-pad page (dpad mode, MDN CC0 sample)
        if: inputs.mode == 'dpad'
        run: |
          curl -sS -L --retry 3 -o web/clip.webm https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm || true
          curl -sS -L --retry 3 -o web/clip.mp4 https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4 || true
          ls -l web
      - name: Download firmware from LG
        env:
          FILEID: ${{ matrix.fileid }}
        run: |
          mkdir -p fw
          curl -sS -L --retry 3 -o fw/fw.zip -D fw/headers.txt "https://gscs-b2c.lge.com/downloadFile?fileId=${FILEID}"
          grep -i content-disposition fw/headers.txt || true
          ls -l fw/fw.zip; sha256sum fw/fw.zip | tee fw/zip.sha256
          df -h / | tail -1
      - name: Beanjar in debian:trixie
        env:
          KERNEL: ${{ matrix.kernel }}
          BOOT_MIN: ${{ inputs.boot_min }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p out && cp fw/zip.sha256 fw/headers.txt out/
          sudo docker run --rm --privileged --device /dev/kvm -v "$PWD:/w" \
            -e FW_ZIP=/w/fw/fw.zip -e KERNEL="$KERNEL" -e BOOT_MIN="$BOOT_MIN" -e MODE="$MODE" -e OUT=/w/out \
            debian:trixie bash /w/run.sh
          echo "---- results"; cat out/results.txt
      - name: Readable outputs
        if: always()
        run: sudo chmod -R a+rwX out || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bj-${{ matrix.name }}-${{ matrix.kernel }}-${{ matrix.runner }}
          path: out
          if-no-files-found: warn
